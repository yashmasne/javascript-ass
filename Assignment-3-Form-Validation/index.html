<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Registration Form</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="background"></div>

    <div class="form-box">

        <div class="logo">
            ✓
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Register to get started
        </p>


        <!-- Name -->

        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
            >

            <p id="nameError" class="error"></p>

        </div>


        <!-- Email -->

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

            <p id="emailError" class="error"></p>

        </div>


        <!-- Phone -->

        <div class="form-group">

            <label for="phone">
                Phone Number
            </label>

            <input
                type="text"
                id="phone"
                placeholder="Enter 10-digit phone number"
                maxlength="10"
            >

            <p id="phoneError" class="error"></p>

        </div>


        <!-- Password -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Minimum 6 characters"
            >

            <p id="passwordError" class="error"></p>

        </div>


        <!-- Submit -->

        <button
            type="button"
            onclick="validateForm()">

            Create Account

        </button>


        <p id="successMessage"
           class="success">
        </p>


        <footer>
            HTML • CSS • JavaScript
        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
