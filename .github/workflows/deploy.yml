name: Deploy JavaScript and React Assignments

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      # Get repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --------------------------------
      # Assignment 4
      # --------------------------------
      - name: Install Assignment 4 dependencies
        working-directory: Assignment-4-React-Profile-Card
        run: npm install

      - name: Build Assignment 4
        working-directory: Assignment-4-React-Profile-Card
        run: npm run build -- --base=/javascript-ass/Assignment-4-React-Profile-Card/

      # --------------------------------
      # Assignment 5
      # --------------------------------
      - name: Install Assignment 5 dependencies
        working-directory: Assignment-5-React-Controlled-Form
        run: npm install

      - name: Build Assignment 5
        working-directory: Assignment-5-React-Controlled-Form
        run: npm run build -- --base=/javascript-ass/Assignment-5-React-Controlled-Form/

      # --------------------------------
      # Assignment 6
      # --------------------------------
      - name: Install Assignment 6 dependencies
        working-directory: Assignment-6-React-Counter
        run: npm install

      - name: Build Assignment 6
        working-directory: Assignment-6-React-Counter
        run: npm run build -- --base=/javascript-ass/Assignment-6-React-Counter/

      # --------------------------------
      # Prepare final GitHub Pages site
      # --------------------------------
      - name: Prepare deployment folder
        run: |
          mkdir -p _site

          # Copy main homepage
          cp index.html _site/index.html

          # Copy Assignment 1
          cp -r Assignment-1-JS-Calculator _site/

          # Copy Assignment 2
          cp -r Assignment-2-Todo-List _site/

          # Copy Assignment 3
          cp -r Assignment-3-Form-Validation _site/

          # Copy React Assignment 4 build
          mkdir -p _site/Assignment-4-React-Profile-Card
          cp -r Assignment-4-React-Profile-Card/dist/* _site/Assignment-4-React-Profile-Card/

          # Copy React Assignment 5 build
          mkdir -p _site/Assignment-5-React-Controlled-Form
          cp -r Assignment-5-React-Controlled-Form/dist/* _site/Assignment-5-React-Controlled-Form/

          # Copy React Assignment 6 build
          mkdir -p _site/Assignment-6-React-Counter
          cp -r Assignment-6-React-Counter/dist/* _site/Assignment-6-React-Counter/

          # Prevent Jekyll from modifying files
          touch _site/.nojekyll

      # Upload GitHub Pages artifact
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4