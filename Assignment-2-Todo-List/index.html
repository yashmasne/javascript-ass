<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - To-Do List</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="background"></div>

    <div class="todo-container">

        <!-- Header -->
        <div class="header">

            <div class="logo">
                ✓
            </div>

            <div>
                <h1>TaskFlow</h1>
                <p>Organize your day. Get things done.</p>
            </div>

        </div>


        <!-- Task Input -->
        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="What needs to be done?"
                onkeydown="handleEnter(event)"
            >

            <button
                type="button"
                onclick="addTask()">

                + Add Task

            </button>

        </div>


        <!-- Task Statistics -->
        <div class="stats">

            <div class="stat">

                <span id="totalTasks">0</span>

                <small>Total</small>

            </div>


            <div class="stat">

                <span id="completedTasks">0</span>

                <small>Completed</small>

            </div>


            <div class="stat">

                <span id="pendingTasks">0</span>

                <small>Pending</small>

            </div>

        </div>


        <!-- Task List -->
        <div class="task-header">

            <h2>My Tasks</h2>

            <button
                type="button"
                onclick="clearCompleted()">

                Clear Completed

            </button>

        </div>


        <ul id="taskList"></ul>


        <!-- Empty Message -->
        <div
            id="emptyMessage"
            class="empty-message">

            <div class="empty-icon">
                ✓
            </div>

            <h3>No tasks yet</h3>

            <p>
                Add a task above and start being productive.
            </p>

        </div>


        <!-- Footer -->
        <footer>

            Built with HTML • CSS • JavaScript

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
